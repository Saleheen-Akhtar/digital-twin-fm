# Render Blueprint — Digital Twin FM (FREE TIER)
#
# Deploy: connect this repo in Render Dashboard → "Blueprint" → this file.
# All services use the free plan. Caveats (free tier only):
#   - Web services spin down after 15 min idle → first request cold-starts (~30-60s).
#   - Free Postgres + Redis are wiped after 90 days. Dump/restore before then,
#     or treat as non-persistent demo data.
#   - MQTT is intentionally DISABLED (no free broker). Ingestion reads
#     HTTP /ingest/* → Redis pub/sub, which is the MVP path.
#   - ai-service is Python/FastAPI; do NOT put it on Vercel (it can't run there).
#
# Internal service DNS (Render private network):
#   dtfm-api-gateway  -> http://dtfm-api-gateway:4000
#   dtfm-ingestion    -> http://dtfm-ingestion:4100
#   dtfm-ai-service   -> http://dtfm-ai-service:8000
# api-gateway reaches ai-service via AI_SERVICE_URL=http://dtfm-ai-service:8000.

services:
  # ── Postgres (free, 90-day expiry) ──────────────────────────
  # Render managed Postgres — the only way to persist data on the free plan.
  # Use DATABASE_URL (connectionString) to connect.
  - type: postgres
    name: dtfm-postgres
    plan: free

  # ── Redis / Valkey (free, 90-day expiry) ───────────────────
  - type: redis
    name: dtfm-redis
    plan: free
    ipAllowList: []

  # ── DB migrate (one-shot Drizzle) ───────────────────────────
  # Runs migrations against dtfm-postgres, then starts a simple HTTP
  # server for Render health checks (required for web services on free plan).
  - type: web
    name: dtfm-db-migrate
    runtime: docker
    dockerfilePath: ./docker/db-migrate.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: postgres
          name: dtfm-postgres
          property: connectionString

  # ── API Gateway (NestJS) ────────────────────────────────────
  - type: web
    name: dtfm-api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./docker/api-gateway.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: postgres
          name: dtfm-postgres
          property: connectionString
      - key: POSTGRES_HOST
        fromService:
          type: postgres
          name: dtfm-postgres
          property: host
      - key: POSTGRES_PORT
        fromService:
          type: postgres
          name: dtfm-postgres
          property: port
      - key: PORT
        sync: false
      - key: REDIS_HOST
        fromService:
          type: redis
          name: dtfm-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: dtfm-redis
          property: port
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: MVP_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: AI_SERVICE_URL
        value: http://dtfm-ai-service:8000

  # ── Ingestion Service (Node/TS, Fastify) ───────────────────
  - type: web
    name: dtfm-ingestion
    runtime: docker
    plan: free
    dockerfilePath: ./docker/ingestion-service.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: INGESTION_HOST
        value: 0.0.0.0
      - key: INGESTION_PORT
        value: "4100"
      - key: REDIS_HOST
        fromService:
          type: redis
          name: dtfm-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: dtfm-redis
          property: port
      - key: INGEST_API_KEY
        sync: false

  # ── AI Service (Python/FastAPI) ─────────────────────────────
  - type: web
    name: dtfm-ai-service
    runtime: docker
    plan: free
    dockerfilePath: ./docker/ai-service.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AI_HOST
        value: 0.0.0.0
      - key: AI_SERVICE_PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LITELLM_MODEL
        value: openai/deepseek-v4-flash-free
      - key: LITELLM_API_BASE
        value: https://opencode.ai/zen/v1
      - key: OPENCODE_ZEN_API_KEY
        sync: false
      - key: API_GATEWAY_URL
        value: http://dtfm-api-gateway:4000
      - key: AI_CORS_ORIGIN
        sync: false
